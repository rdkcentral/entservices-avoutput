name: L1-tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
    secrets:
      RDKCM_RDKE:
        required: true

env:
  ACT: ""
  BUILD_TYPE: Debug
  REPO_NAME: "avoutput"
  THUNDER_REF: "R4.4.1"
  INTERFACES_REF: "develop"
  TOOLCHAIN_FILE: ""
  AUTOMATICS_UNAME: ${{ secrets.AUTOMATICS_UNAME }}
  AUTOMATICS_PASSCODE: ${{ secrets.AUTOMATICS_PASSCODE }}
  RDK_SERVICES_L1_TEST: "ON"
  ENABLE_CACHE: "false"

jobs:
  L1-tests:
    name: Build and run unit tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage

    steps:
      - name: Set up cache
        # Cache Thunder/ThunderInterfaces.
        # https://github.com/actions/cache
        # https://docs.github.com/en/rest/actions/cache
        # Modify the key if changing the list.
        if: ${{ !env.ACT && env.ENABLE_CACHE == 'true' }}
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            build/Thunder
            build/entservices-apis
            build/ThunderTools
            install
            !install/etc/WPEFramework/plugins
            !install/usr/bin/RdkServicesTest
            !install/usr/include/gmock
            !install/usr/include/gtest
            !install/usr/lib/libgmockd.a
            !install/usr/lib/libgmock_maind.a
            !install/usr/lib/libgtestd.a
            !install/usr/lib/libgtest_maind.a
            !install/usr/lib/cmake/GTest
            !install/usr/lib/pkgconfig/gmock.pc
            !install/usr/lib/pkgconfig/gmock_main.pc
            !install/usr/lib/pkgconfig/gtest.pc
            !install/usr/lib/pkgconfig/gtest_main.pc
            !install/usr/lib/wpeframework/plugins
          key: ${{ runner.os }}-${{ env.REPO_NAME }}-${{ env.THUNDER_REF }}-${{ env.INTERFACES_REF }}-4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: ACK External Trigger
        run: |
           echo "Message: External Trigger Received for L1 Tests"
           echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9
        with:
          cmake-version: '3.16.x'

      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y libsqlite3-dev libcurl4-openssl-dev valgrind lcov clang libsystemd-dev libboost-all-dev libwebsocketpp-dev meson libcunit1 libcunit1-dev curl protobuf-compiler-grpc libgrpc-dev libgrpc++-dev libdrm-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Checkout Thunder
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{env.THUNDER_REF}}

      - name: Checkout ThunderTools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: R4.4.3

      - name: Checkout entservices-testframework
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-testframework
          path: entservices-testframework
          ref: 1.0.14

      - name: Checkout entservices-avoutput
        if: ${{ inputs.caller_source == 'local' }}
        uses: actions/checkout@v4
        with:
          path: entservices-avoutput

      - name: Checkout entservices-avoutput-testframework
        if: ${{ inputs.caller_source == 'testframework' }}
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-avoutput
          path: entservices-avoutput
          ref: develop

      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0

      - name: Apply patches ThunderTools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |  
          cd $GITHUB_WORKSPACE/ThunderTools
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/00010-R4.4-Add-support-for-project-dir.patch
          cd -

      - name: Build ThunderTools
        if: steps.cache.outputs.cache-hit != 'true'
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/ThunderTools"
          -B build/ThunderTools
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/ThunderTools -j8
          &&
          cmake --install build/ThunderTools

      - name: Apply patches Thunder
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/Thunder
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/Use_Legact_Alt_Based_On_ThunderTools_R4.4.3.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/error_code_R4_4.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/1004-Add-support-for-project-dir.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/RDKEMW-733-Add-ENTOS-IDS.patch
          cd -

      - name: Build Thunder
        if: steps.cache.outputs.cache-hit != 'true'
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/Thunder"
          -B build/Thunder
          -DMESSAGING=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBINDING=127.0.0.1
          -DPORT=55555
          -DEXCEPTIONS_ENABLE=ON
          &&
          cmake --build build/Thunder -j8
          &&
          cmake --install build/Thunder

      - name: Checkout entservices-apis
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{env.INTERFACES_REF}}
          #token : ${{ secrets.RDKCM_RDKE }}

      - name: Remove DTV schema from entservices-apis
        run: rm -rf $GITHUB_WORKSPACE/entservices-apis/jsonrpc/DTV.json


      - name: Build entservices-apis
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-apis"
          -B build/entservices-apis
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/entservices-apis -j8
          &&
          cmake --install build/entservices-apis

      - name: Generate external headers
        # Empty headers to mute errors
        run: >
          cd "$GITHUB_WORKSPACE/entservices-testframework/Tests/"
          &&
          mkdir -p
          headers
          headers/audiocapturemgr
          headers/rdk/ds
          headers/rdk/iarmbus
          headers/rdk/iarmmgrs-hal
          headers/rdk/halif/deepsleep-manager
          headers/ccec/drivers
          headers/ccec/host
          headers/network
          headers/proc
          &&
          cd headers
          &&
          touch
          rdk/ds/audioOutputPort.hpp
          rdk/ds/AudioStereoMode.hpp
          rdk/ds/compositeIn.hpp
          rdk/ds/dsDisplay.h
          rdk/ds/dsError.h
          rdk/ds/dsMgr.h
          rdk/ds/dsTypes.h
          rdk/ds/dsUtl.h
          rdk/ds/exception.hpp
          rdk/ds/hdmiIn.hpp
          rdk/ds/host.hpp
          rdk/ds/list.hpp
          rdk/ds/manager.hpp
          rdk/ds/sleepMode.hpp
          rdk/ds/videoDevice.hpp
          rdk/ds/VideoDFC.hpp
          rdk/ds/videoOutputPort.hpp
          rdk/ds/videoOutputPortConfig.hpp
          rdk/ds/videoOutputPortType.hpp
          rdk/ds/videoResolution.hpp
          rdk/ds/frontPanelIndicator.hpp
          rdk/ds/frontPanelConfig.hpp
          rdk/ds/frontPanelTextDisplay.hpp
          rdk/ds/audioOutputPortType.hpp
          rdk/ds/audioOutputPortConfig.hpp
          rdk/ds/pixelResolution.hpp
          rdk/iarmbus/libIARM.h
          rdk/iarmbus/libIBus.h
          rdk/iarmbus/libIBusDaemon.h
          rdk/iarmbus/iarmUtil.h
          rdk/halif/deepsleep-manager/deepSleepMgr.h
          rfcapi.h
          rbus.h
          dsRpc.h
          dsDisplay.h
          list.hpp
          telemetry_busmessage_sender.h
          tr181api.h
          tvError.h
          tvTypes.h
          tvTypesODM.h
          tvSettings.h
          tvSettingsODM.h
          tvSettingsExtODM.h

      - name: Set clang toolchain
        if: ${{ matrix.compiler == 'clang' }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/clang.cmake" >> $GITHUB_ENV

      - name: Set gcc/with-coverage toolchain
        if: ${{ matrix.compiler == 'gcc' && matrix.coverage == 'with-coverage' && !env.ACT }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/gcc-with-coverage.cmake" >> $GITHUB_ENV

      - name: Build googletest
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      - name: Checkout entservices-helpers
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-helpers
          path: entservices-helpers
          ref: develop

      - name: Build entservices-helpers
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-helpers"
          -B build/entservices-helpers
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DPLUGIN_HELPERS=ON
          "-DCMAKE_CXX_FLAGS=
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tr181api.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h"
          &&
          cmake --build build/entservices-helpers
          &&
          cmake --install build/entservices-helpers

      - name: Build mocks
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks"
          -B build/mocks
          -DBUILD_SHARED_LIBS=ON
          -DRDK_SERVICES_L1_TEST=${{env.RDK_SERVICES_L1_TEST}}
          -DUSE_THUNDER_R4=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICES_L1_TEST
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-helpers/helpers
          -I $GITHUB_WORKSPACE/install/usr/include
          -I /usr/include/libdrm
          -I /usr/include/gstreamer-1.0
          -I /usr/include/glib-2.0
          -I /usr/lib/x86_64-linux-gnu/glib-2.0/include
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          --coverage
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog -Wl,-wrap,v_secure_system -Wl,-wrap,unlink
          -DENABLE_TELEMETRY_LOGGING
          -DUSE_IARMBUS
          -DHAS_RBUS"
          &&
          cmake --build build/mocks -j8
          &&
          cmake --install build/mocks

      - name: Build entservices-avoutput
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-avoutput"
          -B build/entservices-avoutput
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICES_L1_TEST
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -I /usr/include/libdrm
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          --coverage
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog -Wl,-wrap,v_secure_system -Wl,-wrap,unlink
          -DENABLE_TELEMETRY_LOGGING
          -DUSE_IARMBUS
          -DHAS_RBUS"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_DS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_CEC=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DDS_FOUND=ON
          -DHAS_FRONT_PANEL=ON
          -DRDK_SERVICES_L1_TEST=${{env.RDK_SERVICES_L1_TEST}}
          -DPLUGIN_AVOUTPUT=ON
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          &&
          cmake --build build/entservices-avoutput -j8
          &&
          cmake --install build/entservices-avoutput

      - name: Build entservices-testframework
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-testframework"
          -B build/entservices-testframework
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICES_L1_TEST
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-helpers/helpers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I /usr/include/libdrm
          -I $GITHUB_WORKSPACE/Thunder/Source
          -I $GITHUB_WORKSPACE/Thunder/Source/core
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/thunder/Communicator.h
          --coverage
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog -Wl,--no-as-needed
          -DENABLE_TELEMETRY_LOGGING
          -DUSE_IARMBUS
          -DHAS_RBUS"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_DS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_CEC=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DDS_FOUND=ON
          -DPLUGIN_AVOUTPUT=ON
          -DRDK_SERVICES_L1_TEST=${{env.RDK_SERVICES_L1_TEST}}
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          &&
          cmake --build build/entservices-testframework -j8
          &&
          cmake --install build/entservices-testframework

      - name: Set up files
        run: >
          sudo mkdir -p -m 777
          /opt/persistent
          /opt/secure
          /opt/secure/reboot
          /opt/secure/persistent
          /opt/secure/persistent/System
          /opt/logs
          &&
          sudo touch
          /etc/device.properties
          /version.txt
          &&
          sudo chmod -R 777
          /etc/device.properties
          /version.txt

      - name: Run unit tests without valgrind
        if: ${{ env.RDK_SERVICES_L1_TEST == 'ON'}}
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$(pwd)/rdkL1TestResults.json"
          RdkServicesL1Test &&
          cp -rf $(pwd)/rdkL1TestResults.json $GITHUB_WORKSPACE/rdkL1TestResultsWithoutValgrind.json &&
          rm -rf $(pwd)/rdkL1TestResults.json

      - name: Run unit tests with valgrind
        if: ${{ !env.ACT && inputs.caller_source != 'testframework' && env.RDK_SERVICES_L1_TEST == 'ON'}}
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$(pwd)/rdkL1TestResults.json"
          valgrind
          --tool=memcheck
          --log-file=valgrind_log
          --leak-check=yes
          --show-reachable=yes
          --track-fds=yes
          --fair-sched=try
          RdkServicesL1Test &&
          cp -rf $(pwd)/rdkL1TestResults.json $GITHUB_WORKSPACE/rdkL1TestResultsWithValgrind.json &&
          rm -rf $(pwd)/rdkL1TestResults.json

      - name: Generate coverage
        if: ${{ matrix.coverage == 'with-coverage' && !env.ACT && inputs.caller_source != 'testframework' && env.RDK_SERVICES_L1_TEST == 'ON'}}
        run: |
          cp $GITHUB_WORKSPACE/entservices-testframework/Tests/L1Tests/.lcovrc_l1 ~/.lcovrc

          # Coverage data may be absent for some matrix/toolchain combinations.
          if ! lcov -c -o coverage.info -d build/entservices-avoutput; then
            echo "Coverage capture failed; skipping coverage report generation."
            mkdir -p coverage
            exit 0
          fi

          if [ ! -s coverage.info ]; then
            echo "No coverage.info generated; skipping coverage report generation."
            mkdir -p coverage
            exit 0
          fi

          lcov \
            -r coverage.info \
            '/usr/include/*' \
            '*/build/entservices-avoutput/_deps/*' \
            '*/install/usr/include/*' \
            '*/Tests/headers/*' \
            '*/Tests/mocks/*' \
            '*/Tests/L1Tests/tests/*' \
            '*/Thunder/*' \
            -o filtered_coverage.info

          if [ ! -s filtered_coverage.info ]; then
            echo "Filtered coverage is empty; skipping HTML generation."
            mkdir -p coverage
            exit 0
          fi

          genhtml \
            -o coverage \
            -t "entservices-avoutput coverage" \
            filtered_coverage.info

      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L1-avoutput
          path: |
            coverage/
            valgrind_log
            rdkL1TestResultsWithoutValgrind.json
            rdkL1TestResultsWithValgrind.json
          if-no-files-found: warn
          


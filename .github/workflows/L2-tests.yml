name: L2-tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
    secrets:
      RDKCM_RDKE:
        required: true

env:
  ACT: ""
  BUILD_TYPE: Debug
  THUNDER_TOOLS_COMMIT_SHA: "d5dd83c7c19c49c7f25c558c126500bd2d64f7a4"
  THUNDER_COMMIT_SHA: "2c0fcc5529e7da734be558ca6efa05d934dcce31"
  INTERFACES_REF: "develop"
  TOOLCHAIN_FILE: ""
  AUTOMATICS_UNAME: ${{ secrets.AUTOMATICS_UNAME }}
  AUTOMATICS_PASSCODE: ${{ secrets.AUTOMATICS_PASSCODE }}

jobs:
  L2-tests:
    name: Build and run L2 tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: ACK External Trigger
        run: |
           echo "Message: External Trigger Received for L2 Tests"
           echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9
        with:
          cmake-version: '3.16.x'

      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y libsqlite3-dev libcurl4-openssl-dev valgrind lcov clang libsystemd-dev libboost-all-dev libwebsocketpp-dev meson libcunit1 libcunit1-dev curl protobuf-compiler-grpc libgrpc-dev libgrpc++-dev libdrm-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Checkout Thunder
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{env.THUNDER_COMMIT_SHA}}

      - name: Checkout ThunderTools
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: ${{env.THUNDER_TOOLS_COMMIT_SHA}}

      - name: Checkout entservices-avoutput
        if: ${{ inputs.caller_source == 'local' }}
        uses: actions/checkout@v4
        with:
          path: entservices-avoutput

      - name: Checkout entservices-avoutput-testframework
        if: ${{ inputs.caller_source == 'testframework' }}
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-avoutput
          path: entservices-avoutput
          ref: develop

      - name: Checkout entservices-testframework
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-testframework
          path: entservices-testframework
          ref: feature/RDKEMW-25013

      - name: Checkout entservices-powermanager
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-powermanager
          path: entservices-powermanager
          ref: topic/RDKEMW-6755_testCaseFailureFixes

      - name: Checkout entservices-devicesettings
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-devicesettings
          path: entservices-devicesettings
          ref: topic/RDKEMW-25013

      - name: Checkout rdk-halif-device_settings
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/rdk-halif-device_settings
          path: rdk-halif-device_settings
          ref: 6.0.1

      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0

      - name: Build ThunderTools
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/ThunderTools"
          -B build/ThunderTools
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/ThunderTools -j8
          &&
          cmake --install build/ThunderTools

      - name: Apply patches Thunder
        run: |
          cd $GITHUB_WORKSPACE/Thunder
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/Increase_Timout_For_L2Tests_Plugin_R4_4-RDK.patch
          cd -
      - name: Build Thunder
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/Thunder"
          -B build/Thunder
          -DMESSAGING=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=${{env.BUILD_TYPE}}
          -DBINDING=127.0.0.1
          -DPORT=9998
          -DEXCEPTIONS_ENABLE=ON
          &&
          cmake --build build/Thunder -j8
          &&
          cmake --install build/Thunder

      - name: Checkout entservices-apis
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{env.INTERFACES_REF}}

      - name: Remove DTV schema from entservices-apis
        run: rm -rf $GITHUB_WORKSPACE/entservices-apis/jsonrpc/DTV.json

      - name: Apply patches entservices-apis
        run: |
          cd $GITHUB_WORKSPACE/entservices-apis
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/add-l2tests-interface.patch
          cd -

      - name: Build entservices-apis
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-apis"
          -B build/entservices-apis
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/entservices-apis -j8
          &&
          cmake --install build/entservices-apis

      - name: Generate external headers
        # Empty headers to mute errors
        run: >
          cd "$GITHUB_WORKSPACE/entservices-testframework/Tests/"
          &&
          mkdir -p
          headers
          headers/rdk/iarmbus
          headers/rdk/iarmmgrs-hal
          headers/rdk/halif/deepsleep-manager
          headers/ccec/drivers
          headers/ccec/host
          headers/audiocapturemgr
          headers/network
          headers/systemservices
          headers/systemservices/proc
          &&
          cd headers
          &&
          touch
          rdk/iarmbus/libIARM.h
          rdk/iarmbus/libIBus.h
          rdk/iarmbus/libIBusDaemon.h
          rdk/iarmmgrs-hal/mfrMgr.h
          rdk/iarmmgrs-hal/sysMgr.h
          rdk/iarmbus/iarmUtil.h
          rdk/halif/deepsleep-manager/deepSleepMgr.h
          systemservices/secure_wrapper.h
          rfcapi.h
          rbus.h
          tr181api.h
          tvError.h
          tvTypes.h
          tvTypesODM.h
          tvSettings.h
          tvSettingsExtODM.h
          tvSettingsODM.h
          telemetry_busmessage_sender.h

      - name: Set clang toolchain
        if: ${{ matrix.compiler == 'clang' }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/clang.cmake" >> $GITHUB_ENV

      - name: Set gcc/with-coverage toolchain
        if: ${{ matrix.compiler == 'gcc' && matrix.coverage == 'with-coverage' && !env.ACT }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/gcc-with-coverage.cmake" >> $GITHUB_ENV

      - name: Build googletest
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      - name: Build mocks
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks"
          -B build/mocks
          -DBUILD_SHARED_LIBS=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_CXX_FLAGS="
          -fprofile-arcs
          -ftest-coverage
          -DEXCEPTIONS_ENABLE=ON
          -DUSE_THUNDER_R4=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DRDK_SERVICE_L2_TEST
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests
          -I $GITHUB_WORKSPACE/entservices-helpers/helpers
          -I $GITHUB_WORKSPACE/Thunder/Source
          -I $GITHUB_WORKSPACE/Thunder/Source/core
          -I $GITHUB_WORKSPACE/install/usr/include
          -I /usr/include/libdrm
          -I /usr/include/gstreamer-1.0
          -I /usr/include/glib-2.0
          -I /usr/lib/x86_64-linux-gnu/glib-2.0/include
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          --coverage
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog -Wl,-wrap,v_secure_system -Wl,-wrap,unlink
          -DENABLE_TELEMETRY_LOGGING
          -DUSE_IARMBUS
          -DHAS_RBUS"
          &&
          cmake --build build/mocks -j8
          &&
          cmake --install build/mocks

      - name: Checkout entservices-helpers
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/entservices-helpers
          path: entservices-helpers
          ref: develop

      - name: Build entservices-helpers
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-helpers"
          -B build/entservices-helpers
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DUSE_THUNDER_R4=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DPLUGIN_HELPERS=ON
          "-DCMAKE_CXX_FLAGS=
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tr181api.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h"
          &&
          cmake --build build/entservices-helpers
          &&
          cmake --install build/entservices-helpers

      - name: Copy DeviceSettings HAL headers
        run: >
          mkdir -p "$GITHUB_WORKSPACE/install/usr/include"
          &&
          cp -r "$GITHUB_WORKSPACE/rdk-halif-device_settings/include/." "$GITHUB_WORKSPACE/install/usr/include/"

      - name: Build ds-hal stub
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings"
          -B build/ds-hal
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_CXX_FLAGS="-I $GITHUB_WORKSPACE/install/usr/include"
          &&
          cmake --build build/ds-hal -j8
          &&
          cmake --install build/ds-hal

      - name: Build entservices-powermanager
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-powermanager"
          -B build/entservices-powermanager
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DDEVICE_TYPE=AVOutputTV
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices/proc
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I $GITHUB_WORKSPACE/entservices-helpers/helpers
          -I $GITHUB_WORKSPACE/install/usr/include
          -I /usr/include/gstreamer-1.0
          -I /usr/include/glib-2.0
          -I /usr/lib/x86_64-linux-gnu/glib-2.0/include
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Wraps.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/readprocMockInterface.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -DUSE_IARMBUS
          -DRDK_SERVICE_L2_TEST
          -DDISABLE_SECURITY_TOKEN
          -DHAS_API_POWERSTATE"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_DS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DPLUGIN_POWERMANAGER=ON
          -DUSE_THUNDER_R4=ON
          -DPLUGIN_L2Tests=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DDS_FOUND=ON
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          &&
          cmake --build build/entservices-powermanager -j8
          &&
          cmake --install build/entservices-powermanager

      - name: Build entservices-devicesettings
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-devicesettings"
          -B build/entservices-devicesettings
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DDS_MGR_EVENTID_T_PROVIDED_BY_DEVICESETTINGS
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I $GITHUB_WORKSPACE/entservices-helpers/helpers
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Telemetry.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -DUSE_IARMBUS
          -DUSE_DS"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DDS_FOUND=ON
          -DPLUGIN_DEVICESETTINGS=ON
          -DPLUGIN_DEVICESETTINGS_MODE=Off
          -DUSE_THUNDER_R4=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          &&
          cmake --build build/entservices-devicesettings -j8
          &&
          cmake --install build/entservices-devicesettings

      - name: Build entservices-avoutput
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-avoutput"
          -B build/entservices-avoutput
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -fprofile-arcs
          -ftest-coverage
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I /usr/include/libdrm
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Wraps.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tr181api.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvError.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsExtODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvTypes.h
          -Werror -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -DUSE_IARMBUS
          -DHAS_RBUS
          -DRDK_SERVICE_L2_TEST
          -DDISABLE_SECURITY_TOKEN"
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_DS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_CEC=ON
          -DPLUGIN_AVOUTPUT=ON
          -DUSE_THUNDER_R4=ON
          -DPLUGIN_L2Tests=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DDS_FOUND=ON
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          &&
          cmake --build build/entservices-avoutput
          &&
          cmake --install build/entservices-avoutput

      - name: Build entservices-testframework
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-testframework"
          -B build/entservices-testframework
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -fprofile-arcs
          -ftest-coverage
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-helpers/helpers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/install/usr/include/WPEFramework
          -I /usr/include/libdrm
          -I /usr/include/gstreamer-1.0
          -I /usr/include/glib-2.0
          -I /usr/lib/x86_64-linux-gnu/glib-2.0/include
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Wraps.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tr181api.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvError.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsExtODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvTypes.h
          -Werror -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -Wl,--no-as-needed
          -DUSE_IARMBUS
          -DHAS_RBUS
          -DRDK_SERVICE_L2_TEST
          -DDISABLE_SECURITY_TOKEN"
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_DS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DPLUGIN_AVOUTPUT=ON
          -DUSE_THUNDER_R4=ON
          -DPLUGIN_L2Tests=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DDS_FOUND=ON
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          &&
          cmake --build build/entservices-testframework -j8
          &&
          cmake --install build/entservices-testframework

      - name: Set up files
        run: >
          sudo mkdir -p -m 777
          /opt/persistent
          /opt/secure
          /opt/secure/reboot
          /opt/secure/persistent
          /opt/secure/persistent/System
          /tmp/secure/persistent
          /tmp/persistent
          /tmp/persistent/rdkservicestore
          /opt/logs
          &&
          sudo touch
          /etc/device.properties
          /version.txt
          /tmp/secure/persistent/rdkservicestore
          &&
          sudo chmod -R 777
          /etc/device.properties
          /version.txt
          /tmp/persistent/rdkservicestore
          /tmp/secure/persistent/rdkservicestore

      - name: Download pact_verifier_cli
        run: |
          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}"
          $GITHUB_WORKSPACE/entservices-testframework/Tests/L2Tests/pact/install-verifier-cli.sh

      - name: Run unit tests without valgrind
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          RdkServicesL2Test &&
          cp -rf $(pwd)/rdkL2TestResults.json $GITHUB_WORKSPACE/rdkL2TestResultsWithoutValgrind.json &&
          rm -rf $(pwd)/rdkL2TestResults.json

      - name: Run unit tests with valgrind
        if: ${{ !env.ACT && inputs.caller_source != 'testframework' }}
        run: >
          PATH=$GITHUB_WORKSPACE/install/usr/bin:${PATH}
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH}
          valgrind
          --tool=memcheck
          --log-file=valgrind_log
          --leak-check=yes
          --show-reachable=yes
          --track-fds=yes
          --fair-sched=try
          RdkServicesL2Test &&
          cp -rf $(pwd)/rdkL2TestResults.json $GITHUB_WORKSPACE/rdkL2TestResultsWithValgrind.json &&
          rm -rf $(pwd)/rdkL2TestResults.json

      - name: Generate coverage
        if: ${{ matrix.coverage == 'with-coverage' && !env.ACT && inputs.caller_source != 'testframework'}}
        run: >
          cp $GITHUB_WORKSPACE/entservices-testframework/Tests/L2Tests/.lcovrc_l2 ~/.lcovrc
          &&
          lcov -c
          -o coverage.info
          -d build/entservices-avoutput
          &&
          lcov
          -r coverage.info
          '/usr/include/*'
          '*/build/entservices-avoutput/_deps/*'
          '*/build/mocks/*'
          '*/install/usr/include/*'
          '*/Tests/headers/*'
          '*/Tests/mocks/*'
          '*/Tests/L2Tests/*'
          -o filtered_coverage.info
          &&
          genhtml
          -o coverage
          -t "entservices-avoutput coverage"
          filtered_coverage.info

      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L2-avoutput
          path: |
            coverage/
            valgrind_log
            rdkL2TestResultsWithoutValgrind.json
            rdkL2TestResultsWithValgrind.json
          if-no-files-found: warn

